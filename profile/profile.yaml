# List of Jarvis projects
jarvis_projects:
    # The project description allows hiring managers to understand your project and technologies you used(e.g. programming languages, libraries, algorithms, hardware, tools, etc.).
    # The project description must start with an action verb (https://bit.ly/3guO98u)
  - name: "Linux Cluster Resource Monitoring App"
    git_url: "/linux_sql"
    description: "Designed and implemented a lightweight Linux cluster monitoring system using Bash scripts and crontab to collect hardware specifications and real-time CPU and memory utilization metrics. Stored collected telemetry in a PostgreSQL database running inside Docker and developed SQL-based analytics queries to support capacity planning and performance monitoring. Automated scheduling and deployment to enable reliable, low-overhead monitoring across distributed environments."
  - name: "PostgreSQL Club Booking Database System"
    git_url: "/sql"
    description: " Designed and implemented a normalized relational database system for a recreational club booking platform using PostgreSQL. Created schemas, constraints, and relationships using DDL statements and developed advanced SQL queries leveraging joins, aggregations, subqueries, and window functions to generate operational insights. Containerized the database environment using Docker and automated deployment with Bash scripts to improve portability and reproducibility across environments."
  - name: "Retail Data Wrangling and Analytics"
    git_url: "/python_data_analytics"
    description: "Developed a retail analytics solution to analyze customer purchasing behavior using Python, Pandas, SQLAlchemy, PostgreSQL, and Jupyter Notebook. Performed data cleaning, transformation, and exploratory analysis on transactional datasets and applied RFM segmentation and monthly sales trend analysis to generate customer-level insights. Delivered analytics-ready datasets and data-driven marketing recommendations to support customer retention strategies and campaign targeting."
  - name: "Java Grep Application"
    git_url: "/core_java"
    description: "Developed a command-line text search application in Java 8 that replicates core Linux grep functionality by recursively scanning directories for pattern-based matches using regular expressions. Implemented a functional programming approach using Lambda expressions and the Stream API to improve processing efficiency and memory usage through lazy evaluation. Integrated SLF4J for logging and Maven for dependency management, and packaged the application within a Dockerized environment to enable portable execution across systems while supporting scalable processing of large directory structures."
  - name: "PySpark Data Analysis"
    git_url: "/spark"
    description: "Built distributed data analytics pipelines using PySpark across Databricks and Zeppelin notebook environments to analyze large-scale retail and economic datasets. In Databricks, ingested retail transaction data from PostgreSQL via JDBC and implemented end-to-end analytics with PySpark DataFrames, including monthly sales trends, placed vs. canceled orders, sales growth rates, active users, new vs. existing customer analysis, and RFM-based segmentation. In Zeppelin, analyzed World Development Indicators (WDI) data using PySpark with Hive-backed tables, applying transformations, joins, filtering, and aggregations to strengthen distributed processing workflows. Delivered scalable, business-focused insights into customer behavior and sales performance using structured Spark DataFrame APIs."
  - name: "ETL pipeline for Financial Data"
    git_url: "/spark"
    description: "Financial Fraud Analytics ETL Pipeline [GitHub]: Designed and implemented an end-to-end fraud analytics data pipeline on Azure Databricks using Medallion Architecture (Bronze, Silver, Gold) to ingest, clean, enrich, and analyze multi-source financial transaction datasets. Integrated Azure SQL Database, Azure Data Lake Storage Gen2, PySpark, and JDBC to process transactions, card data, user profiles, merchant category codes, and fraud labels into analytics-ready Delta tables. Built curated Gold-layer datasets to support fraud trend monitoring, high-risk user identification, merchant-category fraud rate analysis, daily fraud loss tracking, and behavioral pattern changes before and after fraud events. Developed interactive Databricks dashboards and scheduled Databricks Jobs to orchestrate automated pipeline execution from ingestion to reporting refresh, enabling scalable and production-style analytics workflows."
  - name: "COBOL Student Registration System"
    git_url: "/mainframe"
    description: "Built a COBOL-based Student Registration System using OpenCobolIDE and GnuCOBOL to simulate mainframe-style indexed file processing. Developed a menu-driven application to generate a student master file, insert new student records, update existing records, delete records, and query students by ID or insertion date. Implemented course-wise report generation using COBOL sorting, sequential file handling, indexed file access, record layouts, and structured procedural logic. Strengthened practical understanding of COBOL fundamentals, copybooks, file control entries, working-storage design, CRUD operations, and report generation in a mainframe-style business application."    


